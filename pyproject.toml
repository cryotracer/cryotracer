[project]
name = "cryotracer"
version = "0.1.0"
description = "Deep learning filament picking for cryo-EM micrographs"
authors = [
    { name = "Radosław Kuczbański", email = "radoslaw.kuczbanski@pwr.edu.pl" },
]
readme = "README.md"
license = "GPL-3.0-only AND Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
keywords = [
    "cryo-em",
    "cryo-electron-microscopy",
    "filament-picking",
    "filament-tracing",
    "particle-picking",
    "helical-reconstruction",
    "relion",
    "deep-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "lightning==2.6.6",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "transformers==5.17.0",
    "huggingface-hub==1.32.0",
    "numpy==2.4.6",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "scipy==1.17.1",
    "mrcfile==1.5.4",
    "starfile==0.5.13",
    "pillow==12.3.0",
    "timm==1.0.30",
    "tqdm==4.70.1",
]

[project.urls]
Homepage = "https://cryotracer.github.io/cryotracer/"
Documentation = "https://cryotracer.github.io/cryotracer/"
Repository = "https://github.com/cryotracer/cryotracer"
Issues = "https://github.com/cryotracer/cryotracer/issues"

[project.scripts]
cryotracer = "cryotracer.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cryotracer"]

[tool.hatch.build.targets.sdist]
include = ["/src/cryotracer", "/README.md", "/pyproject.toml", "/LICENSE*"]

[dependency-groups]
dev = ["pre-commit>=4.6.1", "ruff>=0.16.1", "zensical>=0.0.65"]

[tool.uv]
exclude-newer = "7 days"

[tool.ruff.lint]
extend-select = [
    "I",   # import sorting
    "SIM", # simplifications
    "PIE", # misc improvements
]
